name: Jekyll site CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Run at 00:00 UTC daily to update publication data
    - cron: '0 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHOULD_DEPLOY: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: _scripts/environment.yml
          activate-environment: cv_pdf
          auto-activate-base: false

      - name: Fetch publications from Semantic Scholar
        id: fetch-publications
        shell: bash -el {0}
        run: python ./_scripts/semantic_scholar_scraper.py -a 39400763 -o ./_includes/publications.md

      - name: Update CV with citations and GitHub stats
        shell: bash -el {0}
        run: python ./_scripts/update_cv.py -c ./_includes/cv.md

      - name: Generate CV PDF
        shell: bash -el {0}
        run: python ./_scripts/generate_cv_pdf.py

      - name: Enrich store inventory
        shell: bash -el {0}
        run: python ./_scripts/enrich_inventory.py static/files/store/inventory.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build TypeScript bundles
        run: npm run build
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --future
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8

      - name: Setup Pages
        if: env.SHOULD_DEPLOY == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: env.SHOULD_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        if: env.SHOULD_DEPLOY == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
