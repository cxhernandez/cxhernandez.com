name: cxhernandez.com
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # PDF generation (generate_cv_pdf.py)
  - weasyprint
  - markdown
  # Publication scraper (semantic_scholar_scraper.py)
  - pandas
  - requests  # Required for Semantic Scholar API
  - pdf2image  # PDF to image conversion
  - poppler  # PDF rendering (required by pdf2image)
  - pillow  # Image processing
