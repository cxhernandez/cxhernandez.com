name: cxhernandez.com
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # PDF generation (cli.py generate-pdf)
  - weasyprint >=60,<70
  - markdown >=3.4,<4
  # Publication scraper (cli.py scrape-pubs)
  - pandas >=2,<3
  - requests >=2.28,<3  # Required for Semantic Scholar API
  - tenacity >=8,<10  # Retry logic with exponential backoff
  - pdf2image >=1.16,<2  # PDF to image conversion
  - poppler  # PDF rendering (required by pdf2image)
  - pillow >=10,<12  # Image processing
