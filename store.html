---
layout: default
hide_nav: true
---

<!-- Password Protection -->
<div id="password-gate" class="password-gate">
    <div class="password-gate-wrapper">
        <div class="password-gate-content">
            <h2>Coming Soon...</h2>
            <form id="password-form">
                <input type="password" id="password-input" placeholder="Enter password" autocomplete="off">
            </form>
            <p id="password-error" class="password-error is-hidden" role="alert" aria-live="polite">Incorrect password</p>
        </div>
        <p class="password-gate-back"><a href="/#Photography" class="back-link">&larr; Back</a></p>
    </div>
</div>

<!-- Checkout Modal -->
<div id="checkout-modal" class="checkout-modal is-hidden" role="dialog" aria-modal="true" aria-label="Square Checkout">
    <div class="checkout-modal-backdrop"></div>
    <div class="checkout-modal-content">
        <button class="checkout-modal-close" aria-label="Close checkout">&times;</button>
        <div id="checkout-loading">
            <div class="checkout-spinner"></div>
            <p class="checkout-spinner-text">Loading checkout...</p>
        </div>
        <iframe id="checkout-iframe" class="is-hidden" title="Square Checkout" src="" frameborder="0" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
    </div>
</div>

<!-- Store content is injected dynamically after password verification -->
<!-- This prevents viewing store content in page source -->
<div id="store-main" class="is-hidden">
    <!-- Content loaded via password-verification.bundle.js -->
</div>

<script src="/static/js/dist/password-verification.bundle.js"></script>
<script src="/static/js/dist/store.bundle.js"></script>
