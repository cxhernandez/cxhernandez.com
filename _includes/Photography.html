<section id="Photography" class="parallax">
    <div class="section-header-rotate">
        <h2>Photography</h2>
    </div>

    <div class="container">
        <div class="row-fluid">
            <div class="photography-blurb">
                {% markdown photography.md %}
            </div>
            <div class="photo-carousel">
                <button class="carousel-btn carousel-prev" onclick="moveCarousel(-1)" aria-label="Previous photo">&#10094;</button>

                <div class="carousel-container">
                    <div class="carousel-track" id="carouselTrack">
                        <!-- Loading skeleton -->
                        <div class="carousel-loading">
                            <div class="carousel-skeleton"></div>
                            <p>Loading photos...</p>
                        </div>
                    </div>
                    <!-- Progress bar for auto-advance -->
                    <div class="carousel-progress" id="carouselProgress"></div>
                </div>

                <button class="carousel-btn carousel-next" onclick="moveCarousel(1)" aria-label="Next photo">&#10095;</button>
            </div>

            <div class="carousel-dots" id="carouselDots"></div>
        </div>
    </div>
</section>

<!-- Instagram embed script -->
<script async src="//www.instagram.com/embed.js"></script>

<script>
  const PHOTOS_JSON = '{{ site.baseurl }}/static/img/photography/photos.json';

  let currentSlide = 0;
  let totalSlides = 0;
  let autoAdvanceInterval = null;
  let progressInterval = null;
  let touchStartX = 0;
  let touchEndX = 0;
  const AUTO_ADVANCE_DURATION = 8000; // 8 seconds

  function startAutoAdvance() {
    // Clear any existing intervals
    if (autoAdvanceInterval) {
      clearInterval(autoAdvanceInterval);
    }
    if (progressInterval) {
      clearInterval(progressInterval);
    }

    // Reset and animate progress bar
    const progressBar = document.getElementById('carouselProgress');
    if (progressBar) {
      progressBar.style.transition = 'none';
      progressBar.style.width = '0%';

      // Force reflow
      progressBar.offsetHeight;

      progressBar.style.transition = `width ${AUTO_ADVANCE_DURATION}ms linear`;
      progressBar.style.width = '100%';
    }

    // Start new interval
    autoAdvanceInterval = setInterval(() => {
      moveCarousel(1);
    }, AUTO_ADVANCE_DURATION);
  }

  function stopAutoAdvance() {
    if (autoAdvanceInterval) {
      clearInterval(autoAdvanceInterval);
      autoAdvanceInterval = null;
    }
    if (progressInterval) {
      clearInterval(progressInterval);
      progressInterval = null;
    }

    const progressBar = document.getElementById('carouselProgress');
    if (progressBar) {
      progressBar.style.transition = 'none';
      progressBar.style.width = '0%';
    }
  }

  function handleTouchStart(e) {
    touchStartX = e.changedTouches[0].screenX;
  }

  function handleTouchEnd(e) {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  }

  function handleSwipe() {
    const swipeThreshold = 50;
    const diff = touchStartX - touchEndX;

    if (Math.abs(diff) > swipeThreshold) {
      if (diff > 0) {
        // Swipe left - next
        moveCarousel(1);
      } else {
        // Swipe right - previous
        moveCarousel(-1);
      }
    }
  }

  async function initCarousel() {
    const track = document.getElementById('carouselTrack');
    const dotsContainer = document.getElementById('carouselDots');
    const carousel = document.querySelector('.photo-carousel');
    const carouselContainer = document.querySelector('.carousel-container');

    try {
      const response = await fetch(PHOTOS_JSON);
      if (!response.ok) throw new Error('Failed to load photos.json');

      const data = await response.json();
      const photos = data.photos || [];

      totalSlides = photos.length;

      if (totalSlides === 0) {
        track.innerHTML = '<div class="carousel-slide"><p style="text-align:center;">No photos yet. <a href="https://www.instagram.com/cxhrndz/" style="color:#E1306C;">Visit Instagram →</a></p></div>';
        return;
      }

      // Clear loading skeleton
      track.innerHTML = '';

      // Create slides with Instagram embeds
      photos.forEach((url, index) => {
        const slide = document.createElement('div');
        slide.className = 'carousel-slide';

        const wrapper = document.createElement('div');
        wrapper.className = 'instagram-embed-wrapper';

        // Create minimal blockquote - NO captioned attribute for cleaner embed
        const blockquote = document.createElement('blockquote');
        blockquote.className = 'instagram-media';
        blockquote.setAttribute('data-instgrm-permalink', url);
        blockquote.setAttribute('data-instgrm-version', '14');
        // NOT setting data-instgrm-captioned for cleaner look

        wrapper.appendChild(blockquote);
        slide.appendChild(wrapper);
        track.appendChild(slide);

        // Create dot
        const dot = document.createElement('span');
        dot.className = 'carousel-dot' + (index === 0 ? ' active' : '');
        dot.onclick = () => goToSlide(index);
        dotsContainer.appendChild(dot);
      });

      // Process Instagram embeds
      setTimeout(() => {
        if (window.instgrm) {
          window.instgrm.Embeds.process();
        }
      }, 100);

      // Start auto-advance after embeds load
      setTimeout(() => {
        startAutoAdvance();
      }, 2000);

      // Pause auto-advance on hover, resume on mouse leave
      if (carousel) {
        carousel.addEventListener('mouseenter', stopAutoAdvance);
        carousel.addEventListener('mouseleave', startAutoAdvance);
      }

      // Touch/swipe support
      if (carouselContainer) {
        carouselContainer.addEventListener('touchstart', handleTouchStart, false);
        carouselContainer.addEventListener('touchend', handleTouchEnd, false);
      }

    } catch (error) {
      console.error('Error loading photos:', error);
      track.innerHTML = '<div class="carousel-slide"><p style="text-align:center;">Unable to load photos. <a href="https://www.instagram.com/cxhrndz/" style="color:#E1306C;">Visit Instagram →</a></p></div>';
    }
  }

  function updateCarousel() {
    const track = document.getElementById('carouselTrack');
    track.style.transform = `translateX(-${currentSlide * 100}%)`;
    // Scope to Photography carousel dots only (within #carouselDots)
    document.querySelectorAll('#carouselDots .carousel-dot').forEach((dot, i) => {
      dot.className = 'carousel-dot' + (i === currentSlide ? ' active' : '');
    });

    // Restart auto-advance and progress bar
    if (autoAdvanceInterval) {
      startAutoAdvance();
    }
  }

  function moveCarousel(direction) {
    if (totalSlides === 0) return;
    currentSlide = (currentSlide + direction + totalSlides) % totalSlides;
    updateCarousel();
  }

  function goToSlide(index) {
    if (index === currentSlide) return;
    currentSlide = index;
    updateCarousel();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCarousel);
  } else {
    initCarousel();
  }
</script>
