<section id="Photography" class="parallax">
    <div class="section-header-rotate">
        <h2>Photography</h2>
    </div>

    <div class="container">
        <div class="row-fluid">
            <div class="photography-blurb">
                {% markdown photography.md %}
            </div>
            <div class="photo-carousel" data-photos-json="{{ site.baseurl }}/static/img/photography/photos.json">
                <button class="carousel-btn carousel-prev" aria-label="Previous photo">&#10094;</button>

                <div class="carousel-container">
                    <div class="carousel-track" id="carouselTrack">
                        <!-- Loading skeleton -->
                        <div class="carousel-loading">
                            <div class="carousel-skeleton"></div>
                            <p>Loading photos...</p>
                        </div>
                    </div>
                    <!-- Progress bar for auto-advance -->
                    <div class="carousel-progress" id="carouselProgress"></div>
                </div>

                <button class="carousel-btn carousel-next" aria-label="Next photo">&#10095;</button>
            </div>

            <div class="carousel-dots" id="carouselDots"></div>
        </div>
    </div>
</section>

<!-- Instagram embed script -->
<script async src="//www.instagram.com/embed.js"></script>
<script src="/static/js/dist/photography-carousel.bundle.js"></script>
