<section id="Publications" class="parallax">
    <div class="section-header-rotate">
        <h2>Publications</h2>
    </div>
    <div class="container">
        <div class="row-fluid">
            <div class="blog-big-list">
                <ul class="latest-posts span12">
		    <li class="row-fluid">
                    {% markdown publications.md %}

                    <!-- Publications Carousel -->
                    <div class="publications-carousel">
                      <div class="publications-carousel-container">
                        <!-- Previous button -->
                        <button class="publications-carousel-btn carousel-prev" aria-label="Previous publication">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 18l-6-6 6-6"/>
                          </svg>
                        </button>

                        <!-- Carousel track -->
                        <div class="publications-carousel-track">
                          <!-- Cards will be generated dynamically by JavaScript -->
                        </div>

                        <!-- Next button -->
                        <button class="publications-carousel-btn carousel-next" aria-label="Next publication">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 18l6-6-6-6"/>
                          </svg>
                        </button>
                      </div>

                      <!-- Pagination dots -->
                      <div class="publications-carousel-dots">
                        <!-- Dots will be generated dynamically by JavaScript -->
                      </div>
                    </div>

                                            <script>
                            $(document).ready(function(){
                                    $('.dataframe').DataTable({
                                        pageLength: 5,
                                        lengthChange: false,
                                        dom: 'rtfip',
                                        language: {
                                            search: "",
                                            searchPlaceholder: "Search"
                                        }
                                    });
                                });

                        // Publications Carousel Implementation
                        // Publisher-specific gradients for fallback (kept for local testing without JSON)
                        const publisherGradients = {
                          'Nature': 'linear-gradient(135deg, #0d47a1, #1976d2)',
                          'Biorxiv': 'linear-gradient(135deg, #ff6f00, #ff8f00)',
                          'arXiv': 'linear-gradient(135deg, #b31b1b, #c62828)',
                          'Journal of Open Source Software': 'linear-gradient(135deg, #1565c0, #1976d2)',
                          'Accounts of Chemical Research': 'linear-gradient(135deg, #2e7d32, #388e3c)',
                          'default': 'linear-gradient(135deg, #455a64, #607d8b)'
                        };

                        // Apply figure or fallback gradient to card
                        function applyFigureOrFallback(pub, index) {
                          const $figure = $(`.publication-card-figure[data-figure-container="${index}"]`);
                          $figure.removeClass('loading');

                          if (pub.figureUrl) {
                            // Try to load the pre-fetched figure
                            const img = new Image();
                            img.onload = function() {
                              $figure.css('background-image', `url(${pub.figureUrl})`);
                            };
                            img.onerror = function() {
                              // Fallback to gradient if image fails to load
                              const gradient = pub.fallbackGradient || publisherGradients[pub.journal] || publisherGradients.default;
                              $figure.addClass('fallback').css('background', gradient);
                            };
                            img.src = pub.figureUrl;
                          } else {
                            // No figure available, use fallback gradient
                            const gradient = pub.fallbackGradient || publisherGradients[pub.journal] || publisherGradients.default;
                            $figure.addClass('fallback').css('background', gradient);
                          }
                        }

                        // Create publication card HTML
                        function createPublicationCard(pub, index) {
                          return `
                            <div class="publication-card" data-card-index="${index}">
                              <div class="publication-card-figure loading" data-figure-container="${index}"></div>
                              <div class="publication-card-content">
                                <div class="publication-card-title">${pub.titleHtml}</div>
                                <div class="publication-card-authors">${pub.authors}</div>
                                <div class="publication-card-meta">
                                  <span class="publication-card-journal">${pub.journal}</span>
                                  <span class="publication-card-year">${pub.year || ''}</span>
                                  <span class="publication-card-citations">${(pub.citations || 0).toLocaleString()} citations</span>
                                </div>
                              </div>
                            </div>
                          `;
                        }

                        // Initialize carousel navigation
                        function initCarouselNavigation(totalCards) {
                          const isMobile = window.innerWidth <= 600;
                          const cardsPerView = isMobile ? 1 : 3;
                          let currentIndex = 0;
                          const maxIndex = Math.ceil(totalCards / cardsPerView) - 1;

                          function updateCarousel() {
                            let offset;
                            if (isMobile) {
                              offset = -currentIndex * 100;
                            } else {
                              const cardWidth = 33.333;
                              const gapPercentage = (24 / $('.publications-carousel-container').width()) * 100;
                              offset = -currentIndex * cardsPerView * (cardWidth + gapPercentage);
                            }

                            $('.publications-carousel-track').css('transform', `translateX(${offset}%)`);

                            $('.carousel-dot').removeClass('active');
                            if (isMobile) {
                              $(`.carousel-dot[data-index="${currentIndex}"]`).addClass('active');
                            } else {
                              for (let i = 0; i < cardsPerView; i++) {
                                const dotIndex = currentIndex * cardsPerView + i;
                                if (dotIndex < totalCards) {
                                  $(`.carousel-dot[data-index="${dotIndex}"]`).addClass('active');
                                }
                              }
                            }
                          }

                          function goToSlide(index) {
                            currentIndex = Math.max(0, Math.min(index, maxIndex));
                            updateCarousel();
                          }

                          // Arrow navigation
                          $('.carousel-prev').on('click', function() {
                            goToSlide(currentIndex - 1);
                          });

                          $('.carousel-next').on('click', function() {
                            goToSlide(currentIndex + 1);
                          });

                          // Dot navigation
                          $('.publications-carousel-dots').on('click', '.carousel-dot', function() {
                            const dotIndex = parseInt($(this).data('index'));
                            if (isMobile) {
                              goToSlide(dotIndex);
                            } else {
                              const pageIndex = Math.floor(dotIndex / cardsPerView);
                              goToSlide(pageIndex);
                            }
                          });

                          // Touch/swipe support
                          let touchStartX = 0;
                          let touchEndX = 0;

                          $('.publications-carousel-track').on('touchstart', function(e) {
                            touchStartX = e.changedTouches[0].screenX;
                          });

                          $('.publications-carousel-track').on('touchend', function(e) {
                            touchEndX = e.changedTouches[0].screenX;
                            const swipeThreshold = 50;
                            const diff = touchStartX - touchEndX;

                            if (Math.abs(diff) > swipeThreshold) {
                              if (diff > 0) {
                                goToSlide(currentIndex + 1);
                              } else {
                                goToSlide(currentIndex - 1);
                              }
                            }
                          });

                          // Keyboard navigation
                          $(document).on('keydown', function(e) {
                            if ($('.publications-carousel:visible').length > 0) {
                              if (e.key === 'ArrowLeft') {
                                goToSlide(currentIndex - 1);
                              } else if (e.key === 'ArrowRight') {
                                goToSlide(currentIndex + 1);
                              }
                            }
                          });
                        }

                        $(document).ready(async function() {
                          const isMobile = window.innerWidth <= 600;

                          console.log('Carousel initializing...');
                          console.log('isMobile:', isMobile);

                          try {
                            // Fetch pre-built publication data from static JSON
                            const response = await fetch('/static/files/publications.json');

                            if (!response.ok) {
                              throw new Error(`HTTP error! status: ${response.status}`);
                            }

                            const publications = await response.json();
                            console.log('Loaded publications from JSON:', publications.length);

                            // Generate carousel cards from JSON data
                            publications.forEach((pub, index) => {
                              const card = createPublicationCard(pub, index);
                              $('.publications-carousel-track').append(card);

                              // Generate pagination dots
                              const dot = `<div class="carousel-dot ${index === 0 ? 'active' : ''}" data-index="${index}"></div>`;
                              $('.publications-carousel-dots').append(dot);

                              // Apply pre-fetched figure URL or fallback gradient
                              applyFigureOrFallback(pub, index);
                            });

                            // Initialize carousel navigation
                            initCarouselNavigation(publications.length);

                          } catch (error) {
                            console.error('Error loading publications JSON:', error);
                            console.log('Falling back to DataTable parsing...');

                            // Fallback: parse DataTable if JSON fails (for local development)
                            setTimeout(function() {
                              fallbackParseDataTable();
                            }, 500);
                          }
                        });

                        // Fallback function for local development without pre-built JSON
                        function fallbackParseDataTable() {
                          const isMobile = window.innerWidth <= 600;
                          const publications = [];

                          const table = $('.dataframe').DataTable();
                          const allRows = table.rows().nodes().toArray();

                          console.log('Fallback: Total rows found:', allRows.length);

                          allRows.forEach(function(row) {
                            const cells = $(row).find('td');
                            const titleHtml = cells.eq(1).html();
                            const semanticScholarUrl = $(titleHtml).attr('href');
                            const paperId = semanticScholarUrl ? semanticScholarUrl.match(/\/paper\/([a-f0-9]+)/)?.[1] : null;
                            const journal = cells.eq(3).text();

                            publications.push({
                              paperId: paperId,
                              titleHtml: titleHtml,
                              authors: cells.eq(2).text(),
                              journal: journal,
                              citations: parseInt(cells.eq(4).text()) || 0,
                              year: parseInt(cells.eq(5).text()) || null,
                              figureUrl: null,
                              fallbackGradient: publisherGradients[journal] || publisherGradients.default
                            });
                          });

                          console.log('Fallback: Total publications found:', publications.length);

                          publications.forEach((pub, index) => {
                            const card = createPublicationCard(pub, index);
                            $('.publications-carousel-track').append(card);

                            const dot = `<div class="carousel-dot ${index === 0 ? 'active' : ''}" data-index="${index}"></div>`;
                            $('.publications-carousel-dots').append(dot);

                            applyFigureOrFallback(pub, index);
                          });

                          initCarouselNavigation(publications.length);
                        }
                    </script>
                    </li>
            </ul>
        </div>
	</div>
</div>
</section>
